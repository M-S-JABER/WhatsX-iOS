# Mirrors each push to main into the owner's Notion memory (Mustafa Brain):
# stamps the WhatsX row in the Projects database and appends a Work Log
# entry. Runs are skipped gracefully while the NOTION_TOKEN /
# NOTION_PROJECT_PAGE_ID secrets are unset.
#
# The commit message reaches the script ONLY through env and is JSON-encoded
# by jq — never interpolated into shell text. Commit messages regularly
# contain quotes and could otherwise break the step or inject commands.
name: notion-sync
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update Projects row + add Work Log entry
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROJECT_PAGE_ID: ${{ secrets.NOTION_PROJECT_PAGE_ID }}
          WORKLOG_DB: 7caae097-3ac5-49f0-9d1e-ac9fa6ed09f8
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$PROJECT_PAGE_ID" ]; then
            echo "Notion secrets not configured; skipping sync."
            exit 0
          fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA=${GITHUB_SHA::7}
          # First line of the commit message, capped for the Notion fields.
          TITLE=$(printf '%s' "$COMMIT_MSG" | head -n 1 | cut -c1-150)

          jq -n --arg text "$SHA — $TITLE" --arg now "$NOW" \
            '{properties:{"Last Commit":{rich_text:[{text:{content:$text}}]},"Last Activity":{date:{start:$now}}}}' \
          | curl -sS -X PATCH "https://api.notion.com/v1/pages/$PROJECT_PAGE_ID" \
              -H "Authorization: Bearer $NOTION_TOKEN" -H "Notion-Version: 2022-06-28" \
              -H "Content-Type: application/json" -d @- -o /dev/null -w "projects row: HTTP %{http_code}\n"

          jq -n --arg summary "$REPO_NAME: $TITLE" --arg now "$NOW" --arg sha "$SHA" \
             --arg db "$WORKLOG_DB" --arg page "$PROJECT_PAGE_ID" \
            '{parent:{database_id:$db},properties:{
               Summary:{title:[{text:{content:$summary}}]},
               Date:{date:{start:$now}},
               Source:{select:{name:"GitHub"}},
               Outcome:{select:{name:"✅ Done"}},
               "Commit SHA":{rich_text:[{text:{content:$sha}}]},
               Project:{relation:[{id:$page}]}}}' \
          | curl -sS -X POST "https://api.notion.com/v1/pages" \
              -H "Authorization: Bearer $NOTION_TOKEN" -H "Notion-Version: 2022-06-28" \
              -H "Content-Type: application/json" -d @- -o /dev/null -w "work log: HTTP %{http_code}\n"
