# ⭐ التشغيل الأول لـ match — داخل runner، لا على جهازك.
#
# عادةً يُنفَّذ التشغيل الأول لـ match على جهاز Mac للمطوّر، لأنه يحتاج
# صلاحية الكتابة لتوليد شهادة التوزيع وملف التزويد وتشفيرهما في مستودع
# الشهادات. بما أنك لا تملك Mac، ننفّذه هنا داخل macOS runner.
#
# ┌─ متى تشغّله ─────────────────────────────────────────────────────────┐
# │ مرة واحدة فقط، بعد أن تتحول بوابة المطورين من (Pending) إلى مفعّلة،   │
# │ وبعد ضبط الأسرار الستة. بعدها لا تعده أبداً — كل بناء لاحق يسحب      │
# │ الشهادات المخزَّنة عبر lane :setup_certificates بوضع readonly.        │
# └──────────────────────────────────────────────────────────────────────┘
#
# ⚠️ وضع bootstrap يكتب في مستودع certificates. إعادة تشغيله بلا داعٍ قد
#    تُبطل شهادات قائمة وتكسر أجهزة مثبَّت عليها بناء سابق. لذلك يطلب
#    تأكيداً نصياً صريحاً قبل التنفيذ.
name: ios-certificates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "الوضع المطلوب"
        required: true
        type: choice
        default: verify
        options:
          - verify            # readonly — checks the certificates can be fetched
          - bootstrap         # write — first-time certificate generation (once)
          - refresh-profiles  # write — after an App ID capability change (e.g. push)
      confirm:
        description: "For write modes (bootstrap / refresh-profiles): type CREATE to confirm"
        required: false
        default: ""

concurrency:
  group: ios-certificates
  cancel-in-progress: false      # لا نقطع عملية كتابة على مستودع الشهادات

permissions:
  contents: read

jobs:
  certificates:
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"

    steps:
      - name: التحقق من الأسرار
        run: |
          missing=""
          for s in TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID \
                   APP_STORE_CONNECT_KEY_P8 MATCH_PASSWORD MATCH_GIT_TOKEN; do
            if [ -z "${!s}" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة:$missing — راجع SETUP.md"
            exit 1
          fi
          echo "✅ الأسرار مكتملة."

      - name: Confirmation gate for write modes
        if: ${{ inputs.mode != 'verify' }}
        run: |
          if [ "${{ inputs.confirm }}" != "CREATE" ]; then
            echo "::error::Mode '${{ inputs.mode }}' writes to the certificates repo."
            echo "Re-run with CREATE in the confirm field if you are sure."
            exit 1
          fi
          echo "Confirmed — proceeding with mode '${{ inputs.mode }}'."

      - uses: actions/checkout@v4

      - name: تهيئة Ruby و fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: توليد الشهادات وتخزينها (bootstrap)
        if: ${{ inputs.mode == 'bootstrap' }}
        run: bundle exec fastlane bootstrap_signing

      - name: Refresh profiles after a capability change (refresh-profiles)
        if: ${{ inputs.mode == 'refresh-profiles' }}
        run: bundle exec fastlane refresh_profiles

      - name: التحقق من إمكانية سحب الشهادات (verify)
        if: ${{ inputs.mode == 'verify' }}
        run: bundle exec fastlane setup_certificates

      - name: الخلاصة
        if: success()
        run: |
          if [ "${{ inputs.mode }}" = "bootstrap" ]; then
            echo "### ✅ تم توليد الشهادات" >> $GITHUB_STEP_SUMMARY
            echo "مستودع certificates صار يحتوي شهادة التوزيع وملف التزويد مشفَّرَين." >> $GITHUB_STEP_SUMMARY
            echo "الخطوة التالية: شغّل **ios-release** لرفع أول بناء إلى TestFlight." >> $GITHUB_STEP_SUMMARY
            echo "لا تعد تشغيل bootstrap مرة أخرى." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.mode }}" = "refresh-profiles" ]; then
            echo "### ✅ Profiles refreshed" >> $GITHUB_STEP_SUMMARY
            echo "The provisioning profile now carries the push entitlement." >> $GITHUB_STEP_SUMMARY
            echo "Next: run **ios-release** to ship a signed build." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ الشهادات سليمة وقابلة للسحب" >> $GITHUB_STEP_SUMMARY
            echo "خط الرفع إلى TestFlight جاهز." >> $GITHUB_STEP_SUMMARY
          fi

      - name: السجلات عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certificates-logs
          path: |
            ~/Library/Logs/fastlane/**
            fastlane/report.xml
          retention-days: 14
          if-no-files-found: ignore
