# مواصفة XcodeGen — تولّد WhatsX.xcodeproj من هذا الملف + شجرة Sources/
#
# لا تحتاج Mac: ملف المشروع يُولَّد داخل runner الخاص بـ GitHub Actions
# في كل بناء (راجع .github/workflows/ios-build.yml). لذلك لا يُرفع
# WhatsX.xcodeproj إلى المستودع أبداً — وهو مستثنى في .gitignore.
#
# ملاحظة توقيع: DEVELOPMENT_TEAM و CODE_SIGN_STYLE غير مذكورَين هنا عمداً.
# يضبطهما fastlane وقت البناء الموقّع عبر update_code_signing_settings،
# اعتماداً على TEAM_ID والملفات التي يجلبها match. هكذا يبقى البناء غير
# الموقّع (للتحقق السريع والـ sideload) شغّالاً بلا أي سر.
name: WhatsX
options:
  bundleIdPrefix: com.m-s-jaber
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
# Prebuilt Google WebRTC (stasel's SPM packaging of the official binary).
# Linked into the APP TARGET ONLY — Package.swift stays dependency-free so
# Swift Playgrounds keeps loading; call code is gated on canImport(WebRTC).
# Wide version range: stasel tags track Chrome milestones (major bumps often).
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    minVersion: 120.0.0
    maxVersion: 200.0.0
targets:
  WhatsX:
    type: application
    platform: iOS
    scheme:
      configVariants: []
      testTargets:
        - WhatsXTests
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # Privacy manifest — required by Apple; uploads are rejected without
      # it. Referenced by name rather than by folder: including Resources/
      # wholesale would add Info.plist as a duplicate resource (it is
      # already referenced via INFOPLIST_FILE).
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m-s-jaber.whatsx
        # MARKETING_VERSION is the user-facing App Store version. Bump it
        # by hand for every public release.
        MARKETING_VERSION: "1.25.0"
        # aps-environment for VoIP (PushKit) call pushes. The App ID needs
        # the Push Notifications capability and a regenerated match profile
        # (ios-certificates → refresh-profiles) or signing fails.
        CODE_SIGN_ENTITLEMENTS: Resources/WhatsX.entitlements
        # CURRENT_PROJECT_VERSION is the build number. fastlane rewrites it
        # on every TestFlight upload with the workflow run number, because
        # Apple rejects a duplicate build number under one MARKETING_VERSION.
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # "1,2" = native iPhone + iPad. The inbox renders a two-pane split
        # on iPads >= 700pt wide (InboxView.splitBody); Info.plist grants
        # iPads all four orientations, as multitasking requires. Note for
        # a future App Store submission (not TestFlight): iPad screenshots
        # become mandatory in App Store Connect.
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # اختبارات وحدات مستضافة داخل التطبيق (@testable import WhatsX).
  # تعمل في CI تلقائياً: خطوة الاختبار في ios-build.yml تكتشف مجلد Tests/.
  WhatsXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: WhatsX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m-s-jaber.whatsx.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhatsX.app/WhatsX"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
